[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
authors = ["Vault Contributors"]
license = "MIT OR Apache-2.0"
description = "Encrypted backup library with write-only ingest support"
repository = "https://github.com/vault-project/vault-core"
keywords = ["encryption", "backup", "hpke", "cryptography"]
categories = ["cryptography", "encoding"]

[dependencies]
# Cryptography - versions will be pinned exactly in M1
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
sha2 = "0.10"
hpke = "0.12"
ed25519-dalek = "2.1"
bip39 = { version = "2.0", features = ["rand", "std"] }
zeroize = { version = "1.7", features = ["derive"] }
secrecy = "0.8"
subtle = "2.5"
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
getrandom = "0.2"
rand = "0.8"

[dev-dependencies]
proptest = "1.4"
hex = "0.4"
chrono = "0.4"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"

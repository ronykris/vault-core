# cargo-deny configuration for vault-core
# See: https://embarkstudios.github.io/cargo-deny/

[licenses]
# We use dual MIT/Apache-2.0 licensing
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]
# Warn on copyleft licenses
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]
confidence-threshold = 0.8

[bans]
# Ban packages we specifically don't want
multiple-versions = "warn"  # Warn on duplicate versions
wildcards = "deny"  # Deny version wildcards in dependencies
deny = []  # Specific crates to ban (none yet)

[sources]
# Only allow crates from crates.io and git
unknown-registry = "deny"
unknown-git = "warn"

[advisories]
# Check for security advisories
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
yanked = "deny"
